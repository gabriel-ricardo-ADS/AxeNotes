name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck
            script: typecheck
          - name: lint
            script: lint
          - name: test
            script: test
          - name: build
            script: build
          - name: licenses
            script: license:check
          - name: knip
            script: knip
          - name: format
            script: format:check
    steps:
      - uses: actions/checkout@v7.0.1

      # A versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ${{ matrix.script }}

      # Orçamento de tamanho (gzip) dos chunks principais, sobre o dist que o build acabou de gerar.
      - if: matrix.name == 'build'
        run: pnpm run size:check
